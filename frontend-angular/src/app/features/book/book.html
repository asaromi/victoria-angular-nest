<div class="container mx-auto p-4">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Books</h1>
    <button mat-raised-button color="primary" (click)="onCreate()">
      <mat-icon>add</mat-icon>
      Create Book
    </button>
  </div>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="w-full">
      <!-- Judul Column -->
      <ng-container matColumnDef="judul">
        <th mat-header-cell *matHeaderCellDef> Judul </th>
        <td mat-cell *matCellDef="let element"> {{element.judul}} </td>
      </ng-container>

      <!-- Penulis Column -->
      <ng-container matColumnDef="penulis">
        <th mat-header-cell *matHeaderCellDef> Penulis </th>
        <td mat-cell *matCellDef="let element"> {{element.penulis}} </td>
      </ng-container>

      <!-- Tahun Terbit Column -->
      <ng-container matColumnDef="tahunTerbit">
        <th mat-header-cell *matHeaderCellDef> Tahun </th>
        <td mat-cell *matCellDef="let element"> {{element.tahunTerbit}} </td>
      </ng-container>

      <!-- ISBN Column -->
      <ng-container matColumnDef="isbn">
        <th mat-header-cell *matHeaderCellDef> ISBN </th>
        <td mat-cell *matCellDef="let element"> {{element.isbn}} </td>
      </ng-container>

      <!-- Stok Column -->
      <ng-container matColumnDef="stok">
        <th mat-header-cell *matHeaderCellDef> Stok </th>
        <td mat-cell *matCellDef="let element"> {{element.stok}} </td>
      </ng-container>

      <!-- Kategori Column -->
      <ng-container matColumnDef="kategori">
        <th mat-header-cell *matHeaderCellDef> Kategori </th>
        <td mat-cell *matCellDef="let element"> {{element.kategori}} </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="onPreview(element)" title="Preview">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="primary" (click)="onRent(element)" title="Borrow">
            <mat-icon>shopping_cart</mat-icon>
          </button>
          <button mat-icon-button color="primary" (click)="onEdit(element)" title="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete(element)" title="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="dataSource.data.length === 0" class="p-8 text-center text-gray-500">
      No books found.
    </div>
  </div>
</div>
